services:
  api:
    build: ./backend
    environment:
      REPOSAGE_CORS_ORIGINS: ${REPOSAGE_CORS_ORIGINS:-http://localhost:3000}
      REPOSAGE_MAX_FILE_SIZE_BYTES: ${REPOSAGE_MAX_FILE_SIZE_BYTES:-750000}
      REPOSAGE_MAX_REPOSITORY_FILES: ${REPOSAGE_MAX_REPOSITORY_FILES:-3000}
      REPOSAGE_CHUNK_SIZE: ${REPOSAGE_CHUNK_SIZE:-1200}
      REPOSAGE_CHUNK_OVERLAP: ${REPOSAGE_CHUNK_OVERLAP:-160}
      REPOSAGE_EMBEDDING_DIMENSIONS: ${REPOSAGE_EMBEDDING_DIMENSIONS:-256}
      REPOSAGE_PROVIDER_TIMEOUT_SECONDS: ${REPOSAGE_PROVIDER_TIMEOUT_SECONDS:-60}
      REPOSAGE_LLM_PROVIDER: ${REPOSAGE_LLM_PROVIDER:-extractive}
      REPOSAGE_LLM_MODEL: ${REPOSAGE_LLM_MODEL:-gpt-4o-mini}
      REPOSAGE_LLM_TEMPERATURE: ${REPOSAGE_LLM_TEMPERATURE:-0.1}
      REPOSAGE_OPENAI_API_KEY: ${REPOSAGE_OPENAI_API_KEY:-}
      REPOSAGE_OPENAI_BASE_URL: ${REPOSAGE_OPENAI_BASE_URL:-https://api.openai.com/v1}
      REPOSAGE_GEMINI_API_KEY: ${REPOSAGE_GEMINI_API_KEY:-}
      REPOSAGE_GEMINI_BASE_URL: ${REPOSAGE_GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta}
      REPOSAGE_OLLAMA_BASE_URL: ${REPOSAGE_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      REPOSAGE_EMBEDDING_PROVIDER: ${REPOSAGE_EMBEDDING_PROVIDER:-hashing}
      REPOSAGE_EMBEDDING_MODEL: ${REPOSAGE_EMBEDDING_MODEL:-text-embedding-3-small}
      REPOSAGE_BGE_MODEL: ${REPOSAGE_BGE_MODEL:-BAAI/bge-small-en-v1.5}
      REPOSAGE_NOMIC_API_KEY: ${REPOSAGE_NOMIC_API_KEY:-}
      REPOSAGE_NOMIC_BASE_URL: ${REPOSAGE_NOMIC_BASE_URL:-https://api-atlas.nomic.ai/v1}
      REPOSAGE_VECTOR_STORE_PROVIDER: ${REPOSAGE_VECTOR_STORE_PROVIDER:-local}
      REPOSAGE_QDRANT_URL: ${REPOSAGE_QDRANT_URL:-http://qdrant:6333}
      REPOSAGE_QDRANT_API_KEY: ${REPOSAGE_QDRANT_API_KEY:-}
      REPOSAGE_QDRANT_COLLECTION_PREFIX: ${REPOSAGE_QDRANT_COLLECTION_PREFIX:-reposage}
      REPOSAGE_CHROMA_PATH: ${REPOSAGE_CHROMA_PATH:-/data/chroma}
      REPOSAGE_FAISS_PATH: ${REPOSAGE_FAISS_PATH:-/data/faiss}
    ports:
      - "8000:8000"
    volumes:
      - reposage-data:/data
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      - api
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  reposage-data:
